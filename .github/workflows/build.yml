name: Build TaizouInjector APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "34"
  BUILD_TOOLS_VERSION: "34.0.0"
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools", but the obsolete `tools`
          # package was removed from the SDK repository and makes this
          # step fail with "Failed to find package 'tools'".
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
            "ndk;${{ env.NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> local.properties
          cat local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists and is ARM64
        run: |
          set -e
          echo "=== Looking for APK ==="
          find app/build/outputs -name "*.apk" -type f
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "APK found: $APK"
          ls -lh "$APK"
          echo "=== Native libraries inside APK ==="
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/' || true
          echo "=== Required ARM64 library ==="
          unzip -l "$APK" | grep 'lib/arm64-v8a/libtaizou_core.so'
          if unzip -l "$APK" | grep -qE 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "ERROR: Unexpected non-ARM64 native ABI found in APK"
            exit 1
          fi
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TaizouInjector-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 2
          overwrite: true
